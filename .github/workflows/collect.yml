name: Collecte des positions

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node collector/collect.mjs
      - name: Commit
        run: |
          if git diff --quiet data/; then echo "Rien de neuf"; exit 0; fi
          git config user.name "rhum-bot"
          git config user.email "rhum-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "data: positions $(date -u +%FT%TZ)"
          git push
